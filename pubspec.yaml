name: ludocount
description: A new Flutter project for Board Game Scoring.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.3.3
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  expressions: ^0.2.5+3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  url_launcher: ^6.3.2
  # Mise à jour in-app : appels à l'API GitHub Releases et téléchargement
  # streamé de l'APK (progression) ; testable via MockClient (http/testing).
  http: ^1.6.0
  # Lit à l'exécution la version déclarée dans pubspec.yaml (versionName natif).
  package_info_plus: ^10.2.1
  # Dossier de cache où écrire l'APK téléchargé (déjà présente en transitive).
  path_provider: ^2.1.5
  # Ouvre l'APK via un FileProvider (content://) pour lancer l'installeur
  # système ; url_launcher ne peut pas ouvrir un file:// depuis Android 7.
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "image/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "image/app_icon.png"
